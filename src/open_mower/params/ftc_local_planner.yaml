FTCPlanner:
  # The drivetrain needs a minimum effective command to break static friction.
  # Below ~0.08 m/s linear or ~0.24 rad/s angular, the planner can ask for a
  # correction that is mathematically valid but physically too weak to move.
  acceleration: 0.15
  check_obstacles: false
  oscillation_recovery: false
  debug_pid: true
  forward_only: true
  goal_timeout: 20.0
  kd_ang: 0.0
  kd_lat: 0.2
  kd_lon: 0.0
  ki_ang: 0.0
  ki_ang_max: 62.0
  ki_lat: 0.06153
  ki_lat_max: 62.0
  ki_lon: 0.0
  ki_lon_max: 10.0
  kp_ang: 1.4
  # Lowered 8.0 -> 4.0: the EKF heading under-tracks fast rotation, so a high
  # lateral gain slams wz to saturation and the robot serpentines/orbits the
  # goal instead of converging. Softer lateral correction lets it spiral in.
  kp_lat: 4.0
  kp_lon: 4.0
  # Raised slightly from 0.20 to 0.30 so the automatic heading corrections are
  # still trackable but no longer sit below the mower's real breakaway torque.
  max_cmd_vel_ang: 0.30
  max_cmd_vel_speed: 0.28
  min_cmd_vel_ang: 0.24
  min_cmd_vel_speed: 0.08
  max_follow_distance: 2.5
  max_goal_angle_error: 20.0
  max_goal_distance_error: 0.2
  restore_defaults: false
  speed_angular: 20.0
  speed_fast: 0.25
  speed_fast_threshold: 1.0
  speed_fast_threshold_angle: 20.0
  speed_slow: 0.20
