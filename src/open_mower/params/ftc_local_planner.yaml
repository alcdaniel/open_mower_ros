FTCPlanner:
  # Mower physical drive envelope: min movable ~0.20 m/s, max ~0.28 m/s
  # (wheel 0.18 m @ ~30 rpm). Commanding below 0.20 m/s just stalls/creeps,
  # so the linear speeds are floored at 0.20 and capped at the physical max.
  acceleration: 0.15
  check_obstacles: false
  oscillation_recovery: false
  debug_pid: true
  forward_only: true
  goal_timeout: 20.0
  kd_ang: 0.0
  kd_lat: 0.2
  kd_lon: 0.0
  ki_ang: 0.0
  ki_ang_max: 62.0
  ki_lat: 0.06153
  ki_lat_max: 62.0
  ki_lon: 0.0
  ki_lon_max: 10.0
  kp_ang: 1.4
  # Lowered 8.0 -> 4.0: the EKF heading under-tracks fast rotation, so a high
  # lateral gain slams wz to saturation and the robot serpentines/orbits the
  # goal instead of converging. Softer lateral correction lets it spiral in.
  kp_lat: 4.0
  kp_lon: 4.0
  # Lowered 0.30 -> 0.20: the EKF (xbot_positioning) heading under-integrates
  # fast pivots (measured: 85 deg real -> 32 deg estimated), so commanding fast
  # rotation corrupts the heading and the robot drives off-target. Slower
  # rotation stays within what the EKF can track -> heading stays accurate.
  # The Mega min-PWM floor lets these slower turns still execute.
  max_cmd_vel_ang: 0.20
  max_cmd_vel_speed: 0.28
  max_follow_distance: 2.5
  max_goal_angle_error: 20.0
  max_goal_distance_error: 0.2
  restore_defaults: false
  speed_angular: 20.0
  speed_fast: 0.25
  speed_fast_threshold: 1.0
  speed_fast_threshold_angle: 20.0
  speed_slow: 0.20
