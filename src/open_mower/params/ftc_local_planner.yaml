FTCPlanner:
  # Mower physical drive envelope: min movable ~0.20 m/s, max ~0.28 m/s
  # (wheel 0.18 m @ ~30 rpm). Commanding below 0.20 m/s just stalls/creeps,
  # so the linear speeds are floored at 0.20 and capped at the physical max.
  acceleration: 0.15
  check_obstacles: false
  oscillation_recovery: false
  debug_pid: true
  forward_only: true
  goal_timeout: 20.0
  kd_ang: 0.0
  kd_lat: 0.2
  kd_lon: 0.0
  ki_ang: 0.0
  ki_ang_max: 62.0
  ki_lat: 0.06153
  ki_lat_max: 62.0
  ki_lon: 0.0
  ki_lon_max: 10.0
  kp_ang: 1.8
  kp_lat: 8.0
  kp_lon: 4.0
  max_cmd_vel_ang: 0.3
  max_cmd_vel_speed: 0.28
  max_follow_distance: 2.5
  max_goal_angle_error: 20.0
  max_goal_distance_error: 0.2
  restore_defaults: false
  speed_angular: 20.0
  speed_fast: 0.25
  speed_fast_threshold: 1.0
  speed_fast_threshold_angle: 20.0
  speed_slow: 0.20
